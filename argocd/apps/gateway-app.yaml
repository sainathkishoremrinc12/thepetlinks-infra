apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway-app
spec:
  project: thepetlinks
  source:
    repoURL: https://github.com/ThePetLinks/thepetlinks-infra
    path: helm/gateway
  destination:
    server: https://kubernetes.default.svc
    namespace: gateway
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: thepetlinks-gateway
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/ThePetLinks/ThePetLinks-INFRA.git'
    targetRevision: HEAD
    path: helm/gateway
  destination:
    server: https://kubernetes.default.svc
    namespace: petlinks-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
